<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're invited to EliteLoop</title>
  <meta name="description" content="You've been personally invited to EliteLoop — a private social discovery app for premium events and curated plans.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#07101F">
  <link rel="canonical" href="https://eliteloop.app/invite">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260516c">
  <link rel="shortcut icon" href="/favicon.ico?v=20260516c">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260516b">
  <meta name="apple-itunes-app" content="app-id=6756173969, app-argument=eliteloop://">

  <meta property="og:type" content="website">
  <meta property="og:title" content="You're invited to EliteLoop">
  <meta property="og:description" content="A private social discovery app for premium events and curated plans. Someone in your circle thinks you belong here.">
  <meta property="og:image" content="https://eliteloop.app/og-image.png?v=20260721">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles-claude.css">

  <style>
    body.invite-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(120% 100% at 50% 0%, var(--surface-2), var(--surface-0) 65%);
      padding: 24px;
    }
    .invite-card {
      max-width: 480px;
      width: 100%;
      text-align: center;
      padding: 48px 32px;
      border-radius: var(--r-xl);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
    }
    .invite-mark {
      font-family: var(--font-display);
      font-style: italic;
      color: var(--gold-soft);
      font-size: 15px;
      letter-spacing: 0.02em;
      margin: 0 0 20px;
      opacity: 0.85;
    }
    .invite-card h1 {
      font-family: var(--font-display);
      font-weight: 400;
      font-size: clamp(30px, 6vw, 42px);
      line-height: 1.15;
      color: var(--text-1);
      margin: 0 0 16px;
    }
    .invite-card h1 em {
      font-style: italic;
      color: var(--gold-soft);
    }
    .invite-card p {
      font-family: var(--font-body);
      color: var(--text-2);
      font-size: 16px;
      line-height: 1.7;
      margin: 0 0 32px;
    }
    .invite-actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .invite-note {
      margin-top: 28px;
      font-size: 13px;
      color: var(--text-3);
      font-family: var(--font-body);
    }
  </style>
</head>
<body class="invite-page">

  <div class="invite-card">
    <p class="invite-mark">EliteLoop</p>
    <h1>You've been invited<br>to something <em>selective</em>.</h1>
    <p>A private social discovery app for premium events and curated plans — live in your city, tonight.</p>

    <div class="invite-actions">
      <a id="ios-download" href="https://apps.apple.com/app/id6756173969?ct=web" class="c-btn c-btn--gold" rel="noreferrer noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        <span>App Store</span>
      </a>
      <a id="android-download" href="https://play.google.com/store/apps/details?id=com.eliteloop.app&amp;referrer=utm_source%3Deliteloop.app%26utm_medium%3Dweb%26utm_campaign%3Dweb" class="c-btn c-btn--gold" rel="noreferrer noopener">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.609 1.814L13.792 12 3.61 22.186a.996.996 0 0 1-.61-.92V2.734a1 1 0 0 1 .609-.92zm10.89 10.893l2.302 2.302-10.937 6.333 8.635-8.635zm3.199-3.199l2.302 1.33a1 1 0 0 1 0 1.73l-2.302 1.33-2.535-2.535 2.535-2.535zM5.864 2.658L16.8 8.99l-2.302 2.302-8.635-8.635z"/></svg>
        <span>Google Play</span>
      </a>
    </div>

    <p class="invite-note">Free to join. No invite required to stay — just to get in first.</p>
  </div>

  <script>
    (function () {
      // Referral kodu: /invite/<code> path'inden okunur
      var parts = window.location.pathname.split('/').filter(Boolean);
      var code = parts.length > 1 && parts[0] === 'invite' ? parts[1] : null;
      if (!code) return;

      // Android: Google Play Install Referrer API'si "referrer" query param'ını
      // otomatik olarak kuruluma taşır, uygulama ilk açılışta bunu okuyabilir.
      var androidLink = document.getElementById('android-download');
      var androidUrl = new URL(androidLink.href);
      androidUrl.searchParams.set('referrer', code);
      androidLink.href = androidUrl.toString();

      // iOS: native bir "install referrer" mekanizması yok. Kodu panoya kopyalayıp
      // App Store'a yönlendiriyoruz — uygulama ilk açılışta panoyu kontrol edip
      // eşleşen kodu bulursa referral'ı otomatik uygular (clipboard handoff).
      // Panoya kopyalama her iki platformda da yedek olarak çalışır (Android'de asıl
      // mekanizma referrer query param'ı, ama clipboard ek bir güvenlik ağı maliyetsiz).
      function copyReferralToClipboard() {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText('eliteloop-ref:' + code).catch(function () {});
        }
      }
      document.getElementById('ios-download').addEventListener('click', copyReferralToClipboard);
      androidLink.addEventListener('click', copyReferralToClipboard);
    })();
  </script>
</body>
</html>
